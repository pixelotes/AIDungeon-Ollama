---
apiVersion: v1
kind: Service
metadata:
  name: aidungeon
spec:
  type: {{ .Values.service.type }}
  selector:
    app: aidungeon
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: ws
      port: {{ .Values.service.wsPort }}
      targetPort: ws
