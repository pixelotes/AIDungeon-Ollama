---
replicaCount: 1

image:
  repository: pixelotes/aidungeon
  tag: latest
  pullPolicy: Always

# Backend Ollama instance (assumes the in-cluster Ollama Helm release at the default service name).
ollama:
  host: http://ollama.ollama.svc.cluster.local:11434
  model: qwen3:0.6b
  timeout: 180

# Game UI tunable
actionSuggestions: 4

# The app listens on two ports:
#   8080 — HTTP UI
#   8765 — WebSocket (the browser connects directly to this from index.html)
service:
  type: ClusterIP
  httpPort: 8080
  wsPort: 8765

# Ingress for the HTTP UI only. The WebSocket port (8765) needs separate routing
# (e.g. `kubectl port-forward svc/aidungeon 8765:8765`) because the client
# hardcodes the port in `ws://${hostname}:8765`.
ingress:
  enabled: false
  className: traefik
  host: aidungeon.localhost

# /app/saves is the only writable runtime data we want to persist between restarts.
persistence:
  enabled: true
  size: 1Gi
  storageClass: local-path

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
