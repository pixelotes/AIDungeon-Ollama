---
replicaCount: 1

image:
  repository: pixelotes/aidungeon
  tag: latest
  pullPolicy: Always

# Backend Ollama instance (assumes the in-cluster Ollama Helm release at the default service name).
ollama:
  host: http://ollama.ollama.svc.cluster.local:11434
  model: qwen3:0.6b
  timeout: 180

# Game UI tunable
actionSuggestions: 4

# Single port serves both HTTP (UI) and the WebSocket (path /ws).
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: traefik
  host: aidungeon.localhost

# /app/saves is the only writable runtime data we want to persist between restarts.
persistence:
  enabled: true
  size: 1Gi
  storageClass: local-path

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
